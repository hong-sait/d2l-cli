<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brightspace M1 checks</title>
  <style>
    body { font: 13px system-ui, sans-serif; width: 520px; margin: 16px; color: #202124; }
    h1 { font-size: 17px; margin: 0 0 12px; }
    button { padding: 7px 10px; margin: 0 6px 10px 0; }
    #message { min-height: 18px; color: #5f6368; }
    .table-wrap { max-height: 340px; overflow: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { text-align: left; border: 1px solid #dadce0; padding: 5px; vertical-align: top; }
    th { background: #f1f3f4; }
    #report { width: 100%; height: 130px; box-sizing: border-box; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Brightspace authentication feasibility</h1>
  <button id="run">Run read-only tests</button>
  <button id="copy" disabled>Copy sanitized report</button>
  <button id="native">Test Native Messaging</button>
  <div id="message" role="status">Tests run only after you click, on a learn.sait.ca tab.</div>
  <div id="native-message" role="status">Native host connection has not been tested.</div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>ID</th><th>Context</th><th>Method / path</th><th>Status</th><th>Type</th><th>ms</th><th>Result / note</th><th>Final origin / JSON</th></tr></thead>
    <tbody id="results"><tr><td colspan="8">No tests run.</td></tr></tbody>
    </table>
  </div>
  <textarea id="report" aria-label="Sanitized report" readonly placeholder="Sanitized results will appear here. Response bodies are never shown."></textarea>
  <script src="core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
